<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NJYS Storefront</title>

    <!-- Use the official Stripe.js v3 library -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #333; max-width: 1000px; margin: 0 auto; }
        h1, h2 { border-bottom: 2px solid #635bff; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 2fr 1fr; } }
        .products-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 480px) { .products-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 16px; font-weight: bold; margin: 0 0 10px 0; min-height: 38px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-top: 10px; margin-bottom: 3px; }
        select, input, button { padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; width: 100%; }
        input[type="number"] { max-width: 70px; }
        input[type="text"], input[type="email"] { padding: 10px; margin-bottom: 10px; }
        .cart-panel, .student-panel { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #fefefe; height: fit-content; }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
        .remove-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 12px; width: auto; display: inline; }
        .total-box { font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; }
        .btn-add { background-color: #0a2540; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 12px; }
        .btn-add:hover { background-color: #635bff; }
        .btn-checkout { background-color: #635bff; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; }
        .btn-checkout:hover:not(:disabled) { background-color: #0a2540; }
        .btn-checkout:disabled { background-color: #ccc; cursor: not-allowed; }
        .validation-hint { font-size: 12px; color: #999; margin-top: 8px; font-style: italic; }
        .info-message { background: #e8f4f8; border-left: 4px solid #0a2540; padding: 12px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <script>
        // Global variables initialized at the top
        let cart = [];

        // stripe will be initialized after stripe.js loads below via /api/config
        let stripe = null;

        // Utility: simple email regex for light validation (not perfect but helpful)
        function isProbablyEmail(email) {
            return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
        }

        // Initialize Stripe client by fetching non-secret config from the server
        async function initStripe() {
            try {
                const resp = await fetch('/api/config');
                if (!resp.ok) {
                    console.error('Failed to fetch client config:', resp.statusText);
                    return;
                }
                const cfg = await resp.json();
                if (!cfg.publishableKey) {
                    console.error('No publishableKey returned by /api/config');
                    return;
                }
                if (typeof Stripe === 'function') {
                    stripe = Stripe(cfg.publishableKey);
                } else {
                    console.error('Stripe.js did not load. Check the script src.');
                }
            } catch (err) {
                console.error('Failed to initialize Stripe client:', err);
            }
        }
    </script>

    <h1>NJYS Web Store</h1>
    
    <div class="info-message">
        Welcome! Please verify your information below, select items, and proceed to checkout.
    </div>

    <div class="student-panel" style="margin-bottom: 20px;">
        <h2>Verify Your Info</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label>Student Full Name:</label>
                <input type="text" id="studentInput" placeholder="e.g. Jane Doe" oninput="validateForm()">
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label>Ensemble Name:</label>
                <input type="text" id="ensembleInput" placeholder="e.g. Youth Symphony" oninput="validateForm()">
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label>Parent Email:</label>
                <input type="email" id="emailInput" placeholder="e.g. parent@email.com" oninput="validateForm()">
            </div>
        </div>
    </div>

    <div class="grid">
        <div>
            <h2>Available Items</h2>
            <div class="products-list">
                <!-- Item 1: T-Shirt -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS T-Shirt</div>
                        <label>Color:</label>
                        <select id="color-item1">
                            <option value="Black">Black</option>
                            <option value="Grey">Grey</option>
                            <option value="Navy">Navy</option>
                        </select>
                        <label>Size:</label>
                        <select id="size-item1">
                            <!-- Use data- attributes for safer parsing. Replace data-price-id placeholders with real price_xxx values when ready. -->
                            <option value="price_1U9W26Li0nDifNVEfEp06YLd" data-size="Small" data-unit-price="16.00">Small - $16.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Medium" data-unit-price="16.00">Medium - $16.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Large" data-unit-price="16.00">Large - $16.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="X-Large" data-unit-price="16.00">X-Large - $16.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="2X-Large" data-unit-price="17.00">2X-Large - $17.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="3X-Large" data-unit-price="18.00">3X-Large - $18.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Youth Medium" data-unit-price="14.00">Youth Medium - $14.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Youth Large" data-unit-price="14.00">Youth Large - $14.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Youth X-Large" data-unit-price="14.00">Youth X-Large - $14.00</option>
                        </select>
                        <label>Qty:</label>
                        <input type="number" id="qty-item1" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS T-Shirt','item1')">Add to Cart</button>
                </div>

                <!-- Item 2: Zippered Hoodie -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS Zippered Hoodie</div>
                        <label>Color:</label>
                        <select id="color-item2">
                            <option value="Black">Black</option>
                            <option value="Grey">Grey</option>
                            <option value="Navy">Navy</option>
                        </select>
                        <label>Size:</label>
                        <select id="size-item2">
                            <option value="price_PASTE_ID_HERE" data-size="Small" data-unit-price="35.00">Small - $35.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Medium" data-unit-price="35.00">Medium - $35.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="Large" data-unit-price="35.00">Large - $35.00</option>
                            <option value="price_PASTE_ID_HERE" data-size="X-Large" data-unit-price="35.00">X-Large - $35.00</option>
                        </select>
                        <label>Qty:</label>
                        <input type="number" id="qty-item2" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS Zippered Hoodie','item2')">Add to Cart</button>
                </div>
            </div>
        </div>

        <div>
            <h2>Your Shopping Cart</h2>
            <div class="cart-panel">
                <div id="cartItems">Your cart is empty.</div>
                <div class="total-box">Total: $<span id="cartTotal">0.00</span></div>
                <button class="btn-checkout" id="checkoutBtn" disabled onclick="handleCheckout()">Proceed to Payment</button>
                <div class="validation-hint" id="validationHint"></div>
            </div>
        </div>
    </div>

<script>
    function addItem(itemName, elementId) {
        const variationSelect = document.getElementById(`size-${elementId}`);
        const colorSelect = document.getElementById(`color-${elementId}`);
        const qtyInput = document.getElementById(`qty-${elementId}`);

        const selectedOption = variationSelect && variationSelect.selectedOptions && variationSelect.selectedOptions[0];
        if (!selectedOption) return;

        const colorValue = colorSelect ? colorSelect.value : 'Standard';
        const stripePriceId = selectedOption.value;
        const sizeName = selectedOption.dataset.size || '';
        const price = parseFloat(selectedOption.dataset.unitPrice || '0');
        const qty = qtyInput ? Math.max(1, parseInt(qtyInput.value) || 1) : 1;

        // Basic validation
        if (!stripePriceId || stripePriceId === 'price_PASTE_ID_HERE') {
            alert('Error: missing price ID for this option. Please contact the store admin.');
            return;
        }

        // Prevent negative/zero quantities
        if (qty <= 0) {
            alert('Quantity must be at least 1');
            return;
        }

        const existingIndex = cart.findIndex(c => c.name === itemName && c.size === sizeName && c.color === colorValue);
        if (existingIndex >= 0) {
            cart[existingIndex].qty += qty;
        } else {
            cart.push({ name: itemName, id: stripePriceId, size: sizeName, color: colorValue, price: price, qty: qty });
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        if (!cart || cart.length === 0) {
            container.textContent = 'Your cart is empty.';
            document.getElementById('cartTotal').textContent = '0.00';
            validateForm();
            return;
        }
        // Clear safely
        container.innerHTML = '';
        let total = 0;
        cart.forEach((item, idx) => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'cart-item';

            const left = document.createElement('div');
            const strong = document.createElement('strong');
            strong.textContent = item.name;
            const br = document.createElement('br');
            const small = document.createElement('small');
            small.textContent = `${item.size} - ${item.color} x${item.qty}`;
            left.appendChild(strong);
            left.appendChild(br);
            left.appendChild(small);

            const right = document.createElement('div');
            right.textContent = `$${itemTotal.toFixed(2)}`;
            const rightBr = document.createElement('br');
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.type = 'button';
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', () => { removeItem(idx); });
            right.appendChild(rightBr);
            right.appendChild(removeBtn);

            itemDiv.appendChild(left);
            itemDiv.appendChild(right);
            container.appendChild(itemDiv);
        });
        document.getElementById('cartTotal').textContent = total.toFixed(2);
        validateForm();
    }

    function removeItem(idx) { 
        cart.splice(idx, 1); 
        renderCart(); 
    }

    function validateForm() {
        const studentName = (document.getElementById('studentInput')?.value || '').trim();
        const ensembleName = (document.getElementById('ensembleInput')?.value || '').trim();
        const emailAddress = (document.getElementById('emailInput')?.value || '').trim();
        const cartHasItems = cart.length > 0;
        
        const checkoutBtn = document.getElementById('checkoutBtn');
        const hintElement = document.getElementById('validationHint');
        
        if (studentName && ensembleName && isProbablyEmail(emailAddress) && cartHasItems) {
            checkoutBtn.disabled = false;
            hintElement.textContent = '';
        } else {
            checkoutBtn.disabled = true;
            const missing = [];
            if (!studentName) missing.push('student name');
            if (!ensembleName) missing.push('ensemble name');
            if (!emailAddress || !isProbablyEmail(emailAddress)) missing.push('valid email');
            if (!cartHasItems) missing.push('items in cart');
            hintElement.textContent = `Missing: ${missing.join(', ')}`;
        }
    }

    async function handleCheckout() {
        if (!stripe) {
            alert('Payment system not initialized. Please reload the page.');
            return;
        }
        
        const studentName = document.getElementById('studentInput').value.trim();
        const ensembleName = document.getElementById('ensembleInput').value.trim();
        const emailAddress = document.getElementById('emailInput').value.trim();

        if (!isProbablyEmail(emailAddress)) {
            alert('Please provide a valid parent email address.');
            return;
        }

        // Build payload with only necessary fields (price ids and qtys)
        const payload = {
            cart: cart.map(item => ({ id: item.id, qty: item.qty, size: item.size, color: item.color })),
            studentName,
            ensembleName,
            email: emailAddress
        };

        try {
            const resp = await fetch('/api/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'Failed to create checkout session');

            // Redirect to Checkout using the session id returned from the server
            await stripe.redirectToCheckout({ sessionId: data.id });
        } catch (err) {
            console.error('Checkout error', err);
            alert('Error creating checkout session: ' + (err.message || err));
        }
    }

    // Initialize stripe AFTER the stripe.js script has loaded
    document.addEventListener('DOMContentLoaded', function () {
        initStripe();
    });
</script>
</body>
</html>
