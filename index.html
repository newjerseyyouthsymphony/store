<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NJYS Merch Store</title>
  <style>
    body{margin:0;font:16px system-ui,sans-serif;background:#4a90d9;color:#183042}
    main{max-width:1100px;margin:auto;padding:24px}
    h1,h2{color:#fff}
    .panel{background:#fff;border-radius:12px;padding:16px}
    .customer,.layout{display:grid;gap:16px}
    .customer{grid-template-columns:repeat(3,1fr)}
    .layout{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{background:#fff;border-radius:12px;padding:16px}
    label{display:block;font-weight:bold;font-size:13px;margin-top:8px}
    input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:4px}
    button{border:0;border-radius:8px;padding:11px;background:#4a9ee6;color:#fff;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .cart-row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
    .total{text-align:right;font-size:20px;font-weight:bold;margin-top:12px}
    #message{color:#a32222}
    @media(max-width:800px){.customer,.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>NJYS Merch Store</h1>

  <section class="panel customer">
    <div><label for="student">Student Full Name</label><input id="student" required></div>
    <div><label for="ensemble">Ensemble Name</label><input id="ensemble" required></div>
    <div><label for="email">Parent Email</label><input id="email" type="email" required></div>
  </section>

  <div class="layout">
    <section>
      <h2>Available Items</h2>
      <div id="products" class="products">Loading merchandise…</div>
    </section>

    <aside>
      <h2>Your Cart</h2>
      <div class="panel">
        <div id="cart">Your cart is empty.</div>
        <div id="total" class="total">Total: $0.00</div>
        <p id="message" role="alert"></p>
        <button id="checkout" disabled>Proceed to Payment</button>
      </div>
    </aside>
  </div>
</main>

<script>
let products = [];
let cart = [];

async function loadProducts() {
  try {
    const response = await fetch('/api/products', { cache: 'no-store' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Unable to load products');

    products = data.products || [];
    document.getElementById('products').innerHTML = products.length
      ? products.map((product, index) => `
          <article class="card">
            <h3>${escapeHtml(product.name)}</h3>
            <label>Size
              <select id="size-${index}" onchange="updateVariantPrice(${index})">
                ${product.sizes.map(size => `<option value="${escapeHtml(size)}">${escapeHtml(size)}</option>`).join('')}
              </select>
            </label>
            <label>Color
              <select id="color-${index}" onchange="updateVariantPrice(${index})">
                ${product.colors.map(color => `<option value="${escapeHtml(color)}">${escapeHtml(color)}</option>`).join('')}
              </select>
            </label>
            <p><strong id="price-${index}">$${product.variants[0].price.toFixed(2)}</strong></p>
            <label>Quantity
              <input id="qty-${index}" type="number" min="1" max="99" value="1">
            </label>
            <button onclick="addToCart(${index})">Add to Cart</button>
          </article>
        `).join('')
      : 'No active merchandise is currently available.';
  } catch (error) {
    document.getElementById('products').textContent = error.message;
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[char]));
}

function selectedVariant(index) {
  const product = products[index];
  const size = document.getElementById(`size-${index}`).value;
  const color = document.getElementById(`color-${index}`).value;
  return product.variants.find(variant => variant.size === size && variant.color === color);
}

function updateVariantPrice(index) {
  const variant = selectedVariant(index);
  const priceElement = document.getElementById(`price-${index}`);
  if (variant) {
    priceElement.textContent = `$${variant.price.toFixed(2)}`;
  } else {
    priceElement.textContent = 'Unavailable';
  }
}

function addToCart(index) {
  const product = products[index];
  const variant = selectedVariant(index);
  if (!variant) {
    document.getElementById('message').textContent = 'That size and color combination is unavailable.';
    return;
  }

  const quantityInput = document.getElementById(`qty-${index}`);
  const quantity = Math.max(1, Math.min(99, Number(quantityInput.value) || 1));
  const existing = cart.find(item => item.id === variant.id);

  if (existing) {
    existing.quantity = Math.min(99, existing.quantity + quantity);
  } else {
    cart.push({
      id: variant.id,
      name: product.name,
      size: variant.size,
      color: variant.color,
      price: variant.price,
      quantity
    });
  }

  document.getElementById('message').textContent = '';
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function renderCart() {
  let total = 0;

  document.getElementById('cart').innerHTML = cart.length
    ? cart.map((item, index) => {
        const amount = item.price * item.quantity;
        total += amount;
        return `
          <div class="cart-row">
            <span>
              ${escapeHtml(item.name)}
              <br><small>${escapeHtml(item.size)} / ${escapeHtml(item.color)} × ${item.quantity}</small>
            </span>
            <span>
              $${amount.toFixed(2)}
              <button onclick="removeItem(${index})" style="padding:3px 8px">×</button>
            </span>
          </div>
        `;
      }).join('')
    : 'Your cart is empty.';

  document.getElementById('total').textContent = `Total: $${total.toFixed(2)}`;
  validateCheckout();
}

function validateCheckout() {
  const student = document.getElementById('student').value.trim();
  const ensemble = document.getElementById('ensemble').value.trim();
  const email = document.getElementById('email').value.trim();
  document.getElementById('checkout').disabled = !(cart.length && student && ensemble && email);
}

['student', 'ensemble', 'email'].forEach(id => {
  document.getElementById(id).addEventListener('input', validateCheckout);
});

document.getElementById('checkout').addEventListener('click', async () => {
  const button = document.getElementById('checkout');
  const message = document.getElementById('message');

  button.disabled = true;
  message.textContent = '';

  try {
    const email = document.getElementById('email').value.trim();
    const student = document.getElementById('student').value.trim();
    const ensemble = document.getElementById('ensemble').value.trim();

    const response = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lineItems: cart.map(item => ({ id: item.id, quantity: item.quantity })),
        customerEmail: email,
        clientReferenceId: `${student} | ${ensemble} | ${email}`
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Checkout failed');
    window.location.href = data.url;
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
  }
});

loadProducts();
</script>
</body>
</html>
