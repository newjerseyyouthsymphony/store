<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJYS Storefront</title>
    <!-- Official Secure Stripe Code Library Bridge -->
    <script src="https://stripe.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #333; max-width: 1000px; margin: 0 auto; }
        h1, h2 { border-bottom: 2px solid #635bff; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 2fr 1fr; } }
        .products-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 480px) { .products-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 16px; font-weight: bold; margin: 0 0 10px 0; min-height: 38px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-top: 10px; margin-bottom: 3px; }
        select, input, button { padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; width: 100%; }
        input[type="number"] { max-width: 70px; }
        input[type="text"], input[type="email"] { padding: 10px; margin-bottom: 10px; }
        .cart-panel, .student-panel { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #fefefe; height: fit-content; }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
        .remove-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 12px; width: auto; display: inline; }
        .total-box { font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; }
        .btn-add { background-color: #0a2540; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 12px; }
        .btn-add:hover { background-color: #635bff; }
        .btn-checkout { background-color: #635bff; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; }
        .btn-checkout:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>NJYS Web Store</h1>
    <div class="student-panel" style="margin-bottom: 20px;">
        <h2>Verify Your Info</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;"><label>Student Full Name:</label><input type="text" id="studentInput" placeholder="e.g. Jane Doe" required oninput="validateForm()"></div>
            <div style="flex: 1; min-width: 200px;"><label>Ensemble Name:</label><input type="text" id="ensembleInput" placeholder="e.g. Youth Symphony" required oninput="validateForm()"></div>
            <div style="flex: 1; min-width: 200px;"><label>Parent Email:</label><input type="email" id="emailInput" placeholder="e.g. parent@email.com" required oninput="validateForm()"></div>
        </div>
    </div>
    <div class="grid">
        <div>
            <h2>Available Items</h2>
            <div class="products-list">
                <!-- Item 1: T-Shirt -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS T-Shirt</div>
                        <label>Color:</label><select id="color-item1"><option value="Black">Black</option><option value="Grey">Grey</option><option value="Navy">Navy</option></select>
                        <label>Size:</label>
                        <select id="size-item1">
                            <option value="price_PASTE_ID_HERE,Small,16.00">Small - $16.00</option>
                            <option value="price_PASTE_ID_HERE,Medium,16.00">Medium - $16.00</option>
                            <option value="price_PASTE_ID_HERE,Large,16.00">Large - $16.00</option>
                            <option value="price_PASTE_ID_HERE,X-Large,16.00">X-Large - $16.00</option>
                            <option value="price_PASTE_ID_HERE,2X-Large,17.00">2X-Large - $17.00</option>
                            <option value="price_PASTE_ID_HERE,3X-Large,18.00">3X-Large - $18.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Medium,14.00">Youth Medium - $14.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Large,14.00">Youth Large - $14.00</option>
                            <option value="price_PASTE_ID_HERE,Youth X-Large,14.00">Youth X-Large - $14.00</option>
                        </select>
                        <label>Qty:</label><input type="number" id="qty-item1" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS T-Shirt','item1')">Add to Cart</button>
                </div>

                <!-- Item 2: Zippered Hoodie -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS Zippered Hoodie</div>
                        <label>Color:</label><select id="color-item2"><option value="Black">Black</option><option value="Grey">Grey</option><option value="Navy">Navy</option></select>
                        <label>Size:</label>
                        <select id="size-item2">
                            <option value="price_PASTE_ID_HERE,Small,35.00">Small - $35.00</option>
                            <option value="price_PASTE_ID_HERE,Medium,35.00">Medium - $35.00</option>
                            <option value="price_PASTE_ID_HERE,Large,35.00">Large - $35.00</option>
                            <option value="price_PASTE_ID_HERE,X-Large,35.00">X-Large - $35.00</option>
                            <option value="price_PASTE_ID_HERE,2X-Large,36.00">2X-Large - $36.00</option>
                            <option value="price_PASTE_ID_HERE,3X-Large,37.00">3X-Large - $37.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Medium,33.00">Youth Medium - $33.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Large,33.00">Youth Large - $33.00</option>
                            <option value="price_PASTE_ID_HERE,Youth X-Large,33.00">Youth X-Large - $33.00</option>
                        </select>
                        <label>Qty:</label><input type="number" id="qty-item2" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS Zippered Hoodie','item2')">Add to Cart</button>
                </div>

                <!-- Item 3: Hoodie -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS Hoodie</div>
                        <label>Color:</label><select id="color-item3"><option value="Black">Black</option><option value="Grey">Grey</option><option value="Navy">Navy</option></select>
                        <label>Size:</label>
                        <select id="size-item3">
                            <option value="price_PASTE_ID_HERE,Small,38.00">Small - $38.00</option>
                            <option value="price_PASTE_ID_HERE,Medium,38.00">Medium - $38.00</option>
                            <option value="price_PASTE_ID_HERE,Large,38.00">Large - $38.00</option>
                            <option value="price_PASTE_ID_HERE,X-Large,38.00">X-Large - $38.00</option>
                            <option value="price_PASTE_ID_HERE,2X-Large,39.00">2X-Large - $39.00</option>
                            <option value="price_PASTE_ID_HERE,3X-Large,40.00">3X-Large - $40.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Medium,36.00">Youth Medium - $36.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Large,36.00">Youth Large - $36.00</option>
                            <option value="price_PASTE_ID_HERE,Youth X-Large,36.00">Youth X-Large - $36.00</option>
                        </select>
                        <label>Qty:</label><input type="number" id="qty-item3" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS Hoodie','item3')">Add to Cart</button>
                </div>

                <!-- Item 4: Sweatpants -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS Sweatpants</div>
                        <label>Color:</label><select id="color-item4"><option value="Black">Black</option><option value="Grey">Grey</option><option value="Navy">Navy</option></select>
                        <label>Size:</label>
                        <select id="size-item4">
                            <option value="price_PASTE_ID_HERE,Small,32.00">Small - $32.00</option>
                            <option value="price_PASTE_ID_HERE,Medium,32.00">Medium - $32.00</option>
                            <option value="price_PASTE_ID_HERE,Large,32.00">Large - $32.00</option>
                            <option value="price_PASTE_ID_HERE,X-Large,32.00">X-Large - $32.00</option>
                            <option value="price_PASTE_ID_HERE,2X-Large,33.00">2X-Large - $33.00</option>
                            <option value="price_PASTE_ID_HERE,3X-Large,34.00">3X-Large - $34.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Medium,30.00">Youth Medium - $30.00</option>
                            <option value="price_PASTE_ID_HERE,Youth Large,30.00">Youth Large - $30.00</option>
                            <option value="price_PASTE_ID_HERE,Youth X-Large,30.00">Youth X-Large - $30.00</option>
                        </select>
                        <label>Qty:</label><input type="number" id="qty-item4" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS Sweatpants','item4')">Add to Cart</button>
                </div>

                <!-- Item 5: Tote Bag -->
                <div class="product-card">
                    <div>
                        <div class="product-title">NJYS Tote Bag</div>
                        <label>Color:</label><select id="color-item5"><option value="Black">Black</option><option value="Grey">Grey</option><option value="Navy">Navy</option><option value="Natural">Natural</option></select>
                        <label>Size:</label>
                        <select id="size-item5"><option value="price_PASTE_ID_HERE,Standard,12.00">Standard - $12.00</option></select>
                        <label>Qty:</label><input type="number" id="qty-item5" value="1" min="1">
                    </div>
                    <button class="btn-add" onclick="addItem('NJYS Tote Bag','item5')">Add to Cart</button>
                </div>
            </div>
        </div>
        <div>
            <h2>Your Shopping Cart</h2>
            <div class="cart-panel">
                <div id="cartItems">Your cart is empty.</div>
                <div class="total-box">Total: $<span id="cartTotal">0.00</span></div>
                <button class="btn-checkout" id="checkoutBtn" disabled onclick="handleCheckout()">Proceed to Payment</button>
            </div>
        </div>
    </div>
<script>
    const stripe = Stripe('pk_live_51GbHGJLi0nDifNVEPo7WLcwjHCriorbmgpx2NN6tVuHcnOqNU1Psn4YJY4G1Mrex2UbNOEyP3m825Pzc9FMt25w300mNGxYaju');
    let cart = [];

    function addItem(itemName, elementId) {
        const variationSelect = document.getElementById(`size-${elementId}`);
        const colorSelect = document.getElementById(`color-${elementId}`);
        const qtyInput = document.getElementById(`qty-${elementId}`);
        
        const colorValue = colorSelect ? colorSelect.value : 'Standard';
        const [stripePriceId, sizeName, priceVal] = variationSelect.value.split(',');
        const price = parseFloat(priceVal);
        const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;
        
        const existing = cart.find(c => c.name === itemName && c.size === sizeName && c.color === colorValue);
        if (existing) { existing.qty += qty; } 
        else { cart.push({ name: itemName, id: stripePriceId, size: sizeName, color: colorValue, price: price, qty: qty }); }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        if (cart.length === 0) { 
            container.innerHTML = 'Your cart is empty.'; document.getElementById('cartTotal').textContent = '0.00'; validateForm(); return; 
        }
        container.innerHTML = ''; let total = 0;
        cart.forEach((item, idx) => {
            const itemTotal = item.price * item.qty; total += itemTotal;
            container.innerHTML += `<div class="cart-item"><div><strong>${item.name}</strong> (${item.size}-${item.color}) x${item.qty}</div><div>$${itemTotal.toFixed(2)} <button class="remove-btn" onclick="removeItem(${idx})">✕</button></div></div>`;
        });
        document.getElementById('cartTotal').textContent = total.toFixed(2);
        validateForm();
    }

    function removeItem(idx) { cart.splice(idx, 1); renderCart(); }

    function validateForm() {
        const studentName = document.getElementById('studentInput').value.trim();
        const ensembleName = document.getElementById('ensembleInput').value.trim();
        const emailAddress = document.getElementById('emailInput').value.trim();
        document.getElementById('checkoutBtn').disabled = !(studentName && ensembleName && emailAddress && cart.length > 0);
    }

    async function handleCheckout() {
        const studentName = document.getElementById('studentInput').value.trim();
        const ensembleName = document.getElementById('ensembleInput').value.trim();
        const emailAddress = document.getElementById('emailInput').value.trim();
        const cartDescription = cart.map(c => `${c.name} (${c.size}-${c.color}) x${c.qty}`).join(' | ');
        
        const metadataString = `${studentName} | ${ensembleName} | ${emailAddress} | ${cartDescription}`;
        const lineItems = cart.map(item => ({ price: item.id, quantity: item.qty }));

        stripe.redirectToCheckout({
            lineItems: lineItems,
            mode: 'payment',
            customerEmail: emailAddress,
            clientReferenceId: metadataString,
            successUrl: window.location.href, 
            cancelUrl: window.location.href
        }).then(result => {
            if (result.error) alert(result.error.message);
        });
    } 
</script>
</body>
</html>
